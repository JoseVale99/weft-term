[workspace]
resolver = "3"
members = ["crates/weft", "crates/weft-config", "crates/weft-term"]
default-members = ["crates/weft", "crates/weft-term"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JoseVale99/weft-term"
authors = []

[workspace.dependencies]
# External crates are added through `scripts/bootstrap-deps.sh` (cargo add), so
# no hand-written version guesses land in this file.

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
