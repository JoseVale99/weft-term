[package]
name = "weft"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Weft: a native terminal with agents, written in Rust"
publish = false

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
weft-config = { path = "../weft-config" }
weft-store = { path = "../weft-store" }
weft-term = { path = "../weft-term" }

[lints]
workspace = true
