[package]
name = "weft"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Weft: a native terminal with agents, written in Rust"
publish = false

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
glyphon = "0.12.0"
pollster = "1.0.3"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
webpki-roots = "0.26"
weft-agent = { path = "../weft-agent" }
weft-config = { path = "../weft-config" }
weft-store = { path = "../weft-store" }
weft-term = { path = "../weft-term" }
wgpu = "30.0.2"
winit = "0.30.13"

[lints]
workspace = true
