name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reuses incremental state, so the bookkeeping only costs time.
  CARGO_INCREMENTAL: 0
  # Line tables keep backtraces readable without paying full debug info in
  # the link step, which is what makes the Windows test job slow.
  CARGO_PROFILE_TEST_DEBUG: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job instead of holding a runner for the six
    # hours GitHub allows by default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the compiled dependencies when the job fails, so one red run
          # does not force a cold rebuild on the next one.
          cache-on-failure: true
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        # The debug build already compiles the workspace everywhere; the
        # release link is slow and buys little on macOS and Windows.
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --workspace --release
